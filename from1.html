<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey: Awareness of UPI Fraud</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0056b3; }
        .question { margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .question-text { font-weight: bold; margin-bottom: 10px; }
        .options label { display: block; margin-bottom: 5px; cursor: pointer; }
        button { background-color: #0056b3; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #003d80; }
    </style>
</head>
<body>
<div class="container">
    <h1>Awareness of UPI Fraud Survey</h1>
    <form id="upiForm">
        <div id="surveyQuestions"></div>
        <button type="submit">Submit Survey</button>
    </form>
</div>

<script>
const surveyData = [
	{ q: "1. If you receive a UPI payment request from an unknown person, what would you do?", options: ["Accept it immediately", "Reject it", "Verify the sender first", "Ignore it"] },
  { q: "2. What would you do if you accidentally made a payment to the wrong person?", options: ["Contact the bank/payment app", "Do nothing", "Contact the receiver", "Not sure"] },
  { q: "3. Do you know how to report a fraudulent UPI transaction?", options: ["Yes", "No", "Somewhat", "Not sure"] },
  { q: "4. Where did you learn about UPI fraud?", options: ["Social media", "News/TV", "Friends/family", "Bank/payment app"] },
  { q: "5. How frequently do you see information about UPI fraud?", options: ["Very frequently", "Frequently", "Occasionally", "Never"] },
  { q: "6. Do you think banks provide enough information about UPI fraud prevention?", options: ["Strongly agree", "Agree", "Disagree", "Strongly disagree"] },
  { q: "7. Do you think schools/colleges should educate students about UPI fraud?", options: ["Strongly agree", "Agree", "Disagree", "Strongly disagree"] },
  { q: "8. Do you think elderly people are more vulnerable to UPI fraud?", options: ["Strongly agree", "Agree", "Disagree", "Strongly disagree"] },
  { q: "9. Do you think lack of awareness is a major reason for UPI fraud?", options: ["Strongly agree", "Agree", "Disagree", "Strongly disagree"] },
  { q: "10. Would you report a suspicious UPI transaction immediately?", options: ["Yes", "No", "Maybe", "Not sure"] }
  ];
  
const container = document.getElementById("surveyQuestions");

surveyData.forEach((item, index) => {
  const qDiv = document.createElement("div");
  qDiv.className = "question";
  
  const qText = document.createElement("div");
  qText.className = "question-text";
  qText.innerText = item.q;
  qDiv.appendChild(qText);

  const optsDiv = document.createElement("div");
  optsDiv.className = "options";

  item.options.forEach(opt => {
    const label = document.createElement("label");
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = `q${index}`;
    radio.value = opt;
    radio.required = true;
    
    label.appendChild(radio);
    label.appendChild(document.createTextNode(" " + opt));
    optsDiv.appendChild(label);
  });

  qDiv.appendChild(optsDiv);
  container.appendChild(qDiv);
});

document.getElementById("upiForm").addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Form submitted successfully!");
});
</script>
</body>
</html>
